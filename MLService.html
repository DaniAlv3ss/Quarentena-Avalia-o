<script>
  /**
   * SERVIÇO DE MACHINE LEARNING HÍBRIDO (Regras + Naive Bayes + Auditoria de Contradição)
   * ATUALIZADO: Inclui detector de conflito entre Checkbox (Não) e Texto (Sim).
   */
window.MLService = {
  // Configurações e Dicionários
  config: {
    synonyms: {
      'vga': 'gpu', 'placa_video': 'gpu', 'video': 'gpu', 'rtx': 'gpu', 'gtx': 'gpu', 'radeon': 'gpu', 'geforce': 'gpu',
      'mobo': 'placamae', 'placa_mae': 'placamae', 'motherboard': 'placamae', 'mb': 'placamae', 'mainboard': 'placamae',
      'processador': 'cpu', 'intel': 'cpu', 'amd': 'cpu', 'ryzen': 'cpu', 'core': 'cpu', 'athlon': 'cpu',
      'memoria': 'ram', 'memorias': 'ram', 'pente': 'ram',
      'hdd': 'disco', 'ssd': 'disco', 'nvme': 'disco',
      'fonte': 'psu',
      'cooler': 'refrigeracao', 'fan': 'refrigeracao', 'ventoinha': 'refrigeracao', 'water': 'refrigeracao', 'wc': 'refrigeracao', 'bomba': 'refrigeracao',
      
      'quebrado': 'dano_fisico', 'amassado': 'dano_fisico', 'trincado': 'dano_fisico', 'entortado': 'dano_fisico', 'torto': 'dano_fisico', 'riscado': 'dano_fisico',
      'incompativel': 'incompatibilidade', 'pequeno': 'incompatibilidade', 'cabe': 'incompatibilidade', 'suporta': 'incompatibilidade',
      'travando': 'falha_funcional', 'artefato': 'falha_funcional', 'azul': 'falha_funcional'
    },
    
    // Features que multiplicam o peso da evidência na IA
    importantFeatures: new Set([
        'incompatibilidade', 'nao_suporta', 'nao_cabe', 
        'dano_fisico', 'amassado', 'quebrado', 'oxidacao', 'riscado',
        'ram', 'tela_azul', 'curto', 'queimado',
        'gpu', 'cpu', 'placamae' 
    ]),
    
    minWordFrequency: 2,
    confidenceThreshold: 1.5 
  },

  model: {
    globalVocabulary: new Set(),
    categories: {},
    docCount: 0,
    
    tokenizer: {
      stopWords: new Set(['o','a','os','as','um','uma','de','do','da','em','no','na','por','pelo','pela','para','com','e','ou','que','seu','sua','ao','aos','foi','veio','esta','estava','ficou','tem','sendo']),
      
      stem(word) {
        if (!word || word.length < 4) return word;
        return word.replace(/(?:(s|es|a|o|am|em|indo|endo|ando|ada|ado|aram|iram))$/, '');
      },
      
      tokenize(text) {
        if (!text) return [];
        let rawWords = text.toString().toLowerCase()
          .replace(/[^\w\s\u00C0-\u00FF]/gi, ' ') 
          .split(/\s+/)
          .filter(w => w.length > 2 && !this.stopWords.has(w));

        rawWords = rawWords.map(w => window.MLService.config.synonyms[w] || w);
        const stems = rawWords.map(w => this.stem(w));

        const bigrams = [];
        for (let i = 0; i < stems.length - 1; i++) {
           bigrams.push(stems[i] + "_" + stems[i+1]);
        }
        return [...stems, ...bigrams];
      }
    },

    reset() {
      this.categories = {};
      this.globalVocabulary = new Set();
      this.docCount = 0;
    },
    
    train(dataset) {
      this.reset();
      if(!dataset || dataset.length === 0) return;

      const tempWordCounts = {}; 

      const labelMap = {
          'aprovado pagamento': 'ok_pagamento', 'pagar': 'ok_pagamento', 'ok_pagamento': 'ok_pagamento', 'ok': 'ok_pagamento',
          'reprovado pagamento': 'nao_pagar', 'reprovado': 'nao_pagar', 'nao_pagar': 'nao_pagar', 'não pagar': 'nao_pagar',
          'avaria customiza': 'avaria_parceiro', 'parceiro': 'avaria_parceiro', 'avaria_parceiro': 'avaria_parceiro', 'avaria': 'avaria_parceiro'
      };

      dataset.forEach(originalItem => {
        const item = { ...originalItem };
        
        const processo = (item.processo || item['Processo?'] || '').toString().toLowerCase();
        const avaria = (item.avariaCust || item['Avaria customiza?'] || '').toString().toLowerCase();
        let rawCat = (item.categoria || item.Considerações || '').toString().toLowerCase().trim();

        if (processo.includes('antes')) rawCat = 'nao_pagar'; 
        else if (avaria.includes('sim')) rawCat = 'avaria_parceiro';

        const finalCat = labelMap[rawCat];
        if (!finalCat || finalCat === 'indefinido') return;

        if(!this.categories[finalCat]) {
            this.categories[finalCat] = { docCount: 0, wordCounts: {}, totalWords: 0 };
        }
        
        this.categories[finalCat].docCount++;
        this.docCount++;
        
        const textToLearn = item.texto || item['Detalhe o problema encontrado'];
        const tokens = this.tokenizer.tokenize(textToLearn);
        
        tokens.forEach(token => {
           tempWordCounts[token] = (tempWordCounts[token] || 0) + 1;
           let weight = 1;
           if (window.MLService.config.importantFeatures.has(token)) weight = 4;

           if(!this.categories[finalCat].wordCounts[token]) this.categories[finalCat].wordCounts[token] = 0;
           this.categories[finalCat].wordCounts[token] += weight;
           this.categories[finalCat].totalWords += weight;
        });
      });

      const minFreq = window.MLService.config.minWordFrequency;
      Object.keys(this.categories).forEach(cat => {
          const catData = this.categories[cat];
          Object.keys(catData.wordCounts).forEach(token => {
              if (tempWordCounts[token] < minFreq && !window.MLService.config.importantFeatures.has(token)) {
                  catData.totalWords -= catData.wordCounts[token];
                  delete catData.wordCounts[token];
                  return;
              }
              this.globalVocabulary.add(token);
          });
      });
      console.log(`ML Treinado. Classes Ativas: ${Object.keys(this.categories).join(', ')}`);
    },
    
    classify(text, forbiddenCategories = []) {
      if (!text || this.docCount === 0) return { category: 'indefinido', reason: 'Sem dados de treino' };
      const tokens = this.tokenizer.tokenize(text);
      if (tokens.length === 0) return { category: 'indefinido', reason: 'Texto insuficiente' };

      let bestCategory = null;
      let maxProb = -Infinity;
      let secondMaxProb = -Infinity; 
      const vocabSize = this.globalVocabulary.size;
      const evidences = [];

      Object.keys(this.categories).forEach(catName => {
        if (forbiddenCategories.includes(catName)) return;

        const catData = this.categories[catName];
        let logProb = Math.log(catData.docCount / this.docCount);
        
        tokens.forEach(token => {
          if (!this.globalVocabulary.has(token)) return; 
          const wordCount = catData.wordCounts[token] || 0;
          const pWord = (wordCount + 1) / (catData.totalWords + vocabSize + 1);
          logProb += Math.log(pWord);
        });
        
        if (logProb > maxProb) {
          secondMaxProb = maxProb;
          maxProb = logProb;
          bestCategory = catName;
        } else if (logProb > secondMaxProb) {
          secondMaxProb = logProb;
        }
      });
      
      const gap = maxProb - secondMaxProb;
      const confident = !isNaN(gap) && gap >= window.MLService.config.confidenceThreshold;
      
      if (bestCategory && confident) {
          const catData = this.categories[bestCategory];
          tokens.forEach(t => {
             if ((catData.wordCounts[t] && catData.wordCounts[t] > 0) || window.MLService.config.importantFeatures.has(t)) {
                 evidences.push(t);
             }
          });
      }

      const uniqueEvidence = [...new Set(evidences)].slice(0, 5).join(', ');

      return {
          category: confident ? bestCategory : 'indefinido',
          reason: confident ? `Padrão de palavras: ${uniqueEvidence}` : 'Confiança baixa',
          confidence: gap
      };
    }
  },

  train(data) { this.model.train(data); },
  
  // --- NOVA FUNÇÃO: DETECTOR DE CONTRADIÇÃO ---
  detectarContradicao(text, context) {
      if (!text) return null;
      
      // 1. Normaliza o texto (remove acentos e deixa minúsculo)
      const t = text.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      
      // 2. Dicionários de "Crime" e "Agente"
      // Palavras que indicam QUEM causou o dano
      const agentes = ['tecnico', 'tc ', 'montador', 'montagem', 'manuseio', 'organizacao', 'manuzeio'];
      
      // Palavras que indicam O QUE aconteceu (Dano físico/Ação)
      const acoesDano = ['amassou', 'amassado', 'entortou', 'entortado', 'quebrou', 'quebrado', 'cortou', 'cortado', 'riscou', 'riscado', 'derrubou', 'espanou', 'pino torto', 'pino amassado', 'avaria', 'rompido', 'trincado'];

      // 3. Verifica se o texto contém Agente E Ação
      const temAgente = agentes.some(ag => t.includes(ag));
      const temDano = acoesDano.some(ac => t.includes(ac));
      const isFabrica = t.includes('fabrica'); // Evita falso positivo tipo "defeito de fabrica"

      // 4. Lógica Sherlock Holmes:
      // Se tem Agente + Dano e NÃO é defeito de fábrica, é Parceiro.
      if (temAgente && temDano && !isFabrica) {
          return {
              category: 'avaria_parceiro',
              reason: '🚩 CONTRADIÇÃO: Texto descreve avaria causada pelo técnico/processo interno.',
              confidence: 5.0, // Confiança Máxima
              isContradiction: true
          };
      }
      
      // Se apenas menciona o agente em contexto de quarentena, já é forte indício
      if (temAgente && !isFabrica) {
           return {
              category: 'avaria_parceiro',
              reason: 'Hard Rule: Menção de intervenção técnica (Montagem/Manuseio).',
              confidence: 4.5
          };
      }

      return null;
  },

  predict(text, context) {
      let forbidden = [];
      
      // 1. REGRAS RÍGIDAS DE METADADOS (O que o usuário marcou)
      if (context) {
          const avariaInput = (context.avariaCust || context['Avaria customiza?'] || '').toString().trim().toLowerCase();
          const processo = (context.processo || context['Processo?'] || '').toString().trim().toLowerCase();

          // Se o usuário marcou SIM, confiamos nele.
          if (avariaInput.includes('sim')) {
              return { category: 'avaria_parceiro', reason: 'Regra: Checkbox Avaria marcado como SIM' };
          }
          
          // Se erro antes da montagem
          if (processo.includes('antes')) {
               return { category: 'nao_pagar', reason: 'Regra: Problema identificado ANTES da montagem' };
          }
      }

      // 2. DETECTOR DE CONTRADIÇÃO (Onde o usuário marcou NÃO ou esqueceu, mas o texto confessa)
      // Esta etapa agora protege contra o erro humano de preenchimento
      const resultadoContradicao = this.detectarContradicao(text, context);
      if (resultadoContradicao) {
          return resultadoContradicao;
      }

      // 3. IA (Naive Bayes) - Só roda se não caiu nas regras acima
      return this.model.classify(text, forbidden);
  }
};
</script>
