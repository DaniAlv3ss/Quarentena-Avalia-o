<script>
window.ReportService = {
  // CONFIG
  colors: {
    primary: [234, 88, 12], // Brand Orange
    header: [30, 41, 59], // Slate 800
    rowEven: [248, 250, 252], // Slate 50
    text: [51, 65, 85]
  },

  formatCurrency(value) {
    return (value || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  },

  formatStatus(s) {
    const map = {
      'ok_pagamento': 'APROVADO',
      'avaria_parceiro': 'AVARIA PARCEIRO',
      'nao_pagar': 'REPROVADO',
      'pendente': 'PENDENTE'
    };
    return map[s] || (s ? s.toUpperCase() : '-');
  },

  // --- GERADOR DE CSV ---
  exportarCSV(dados, colunasSelecionadas) {
    if (!dados || dados.length === 0) return alert("Sem dados para exportar.");

    // Se nenhuma coluna foi passada, usa todas (fallback)
    let cols = colunasSelecionadas;
    if (!cols || cols.length === 0) {
       cols = Object.keys(dados[0]);
    }

    // Processa os dados para "Aplanar" objetos complexos (Flatten)
    const flatData = dados.map(item => {
        const flat = { ...item };
        
        // Pega dados da última ocorrência para facilitar leitura
        if (item._subRecords && item._subRecords.length > 0) {
            const last = item._subRecords[item._subRecords.length - 1];
            flat.PROBLEMA_PRINCIPAL = last.problema;
            flat.DETALHE_PRINCIPAL = last.detalhe;
        } else {
            flat.PROBLEMA_PRINCIPAL = item['QUAL PROBLEMA?'] || '';
            flat.DETALHE_PRINCIPAL = item['DETALHE O PROBLEMA ENCONTRADO'] || '';
        }
        
        flat.STATUS_FINAL = this.formatStatus(item._status);
        
        return flat;
    });

    const worksheet = XLSX.utils.json_to_sheet(flatData, { header: cols });
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Dados Validação");
    
    // Ajuste de largura automática (Simples)
    const wscols = cols.map(c => ({ wch: 20 }));
    worksheet['!cols'] = wscols;

    XLSX.writeFile(workbook, `Validacao_Quarentena_${new Date().toISOString().slice(0,10)}.csv`);
  },

  // --- GERADOR DE PDF ---
  exportarPDF(dados, stats, tipo = 'completo') {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageWidth = doc.internal.pageSize.width;
    const pageHeight = doc.internal.pageSize.height;
    
    // --- CABEÇALHO PADRÃO ---
    doc.setFillColor(...this.colors.header);
    doc.rect(0, 0, pageWidth, 25, 'F');
    
    doc.setFontSize(18);
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.text("Relatório de Validação de Quarentena", 14, 16);
    
    doc.setFontSize(10);
    doc.setFont("helvetica", "normal");
    doc.text(`Gerado em: ${new Date().toLocaleString()}`, 14, 22);

    let currentY = 35;

    // --- BLOCO FINANCEIRO (SEMPRE APARECE) ---
    doc.setDrawColor(200, 200, 200);
    doc.setFillColor(255, 255, 255);
    
    // Card 1: Aprovados (ALTERADO: Apenas Montagem)
    this.drawCard(doc, 14, currentY, 55, 
        "Custo Montagem", 
        this.formatCurrency(stats.assemblyCost), // Valor direto da montagem
        `${stats.approvedCount} aprovados x R$ 189,90`, 
        [22, 163, 74]); // Green

    // Card 2: Avaria Parceiro
    this.drawCard(doc, 75, currentY, 55, 
        "Custo Avaria", 
        this.formatCurrency(stats.partnerCost), 
        `${stats.partnerCount} und.`, 
        [234, 179, 8]); // Amber

    // Card 3: Reprovados
    this.drawCard(doc, 136, currentY, 55, 
        "Custo Reprovado", 
        this.formatCurrency(stats.rejectedCost), 
        `${stats.rejectedCount} und.`, 
        [225, 29, 72]); // Rose

    currentY += 40;

    // --- TABELA DETALHADA (SÓ SE FOR COMPLETO) ---
    if (tipo === 'completo') {
        doc.setFontSize(12);
        doc.setTextColor(0, 0, 0);
        doc.setFont("helvetica", "bold");
        doc.text("Detalhamento por Ordem de Serviço", 14, currentY);
        currentY += 5;

        const tableBody = dados.map(item => {
            const lastSub = (item._subRecords || [])[item._subRecords.length - 1] || {};
            const problema = lastSub.problema || item['QUAL PROBLEMA?'] || '-';
            
            return [
                item.OS || item['NÚMERO OS'],
                item['NOME DO TÉCNICO'] || '-',
                problema.substring(0, 40) + (problema.length > 40 ? '...' : ''),
                this.formatStatus(item._status)
                // REMOVIDO: this.formatCurrency(item._custoTotal)
            ];
        });

        doc.autoTable({
            startY: currentY,
            // REMOVIDO COLUNA CUSTO TOTAL
            head: [['OS', 'Técnico', 'Problema', 'Status']],
            body: tableBody,
            theme: 'grid',
            headStyles: { fillColor: this.colors.header, textColor: 255, fontSize: 8 },
            bodyStyles: { fontSize: 8, textColor: this.colors.text },
            alternateRowStyles: { fillColor: this.colors.rowEven },
            margin: { top: 25 }
        });
    } else {
        // Mensagem de relatório simples
        doc.setFontSize(10);
        doc.setTextColor(100, 100, 100);
        doc.text("Este é um relatório sintético. Para ver detalhes por OS, gere o relatório Analítico.", 14, currentY + 10);
    }

    doc.save(`Relatorio_Validacao_${tipo}_${new Date().toISOString().slice(0,10)}.pdf`);
  },

  drawCard(doc, x, y, w, title, value, subtext, colorInfo) {
      // Border Left Color
      doc.setDrawColor(230, 230, 230);
      doc.setFillColor(250, 250, 250);
      doc.roundedRect(x, y, w, 28, 2, 2, 'FD');
      
      // Color Strip
      doc.setFillColor(...colorInfo);
      doc.rect(x, y, 1.5, 28, 'F');

      // Text
      doc.setFontSize(8);
      doc.setTextColor(100, 100, 100);
      doc.text(title.toUpperCase(), x + 4, y + 6);

      doc.setFontSize(12);
      doc.setFont("helvetica", "bold");
      doc.setTextColor(30, 41, 59);
      doc.text(value, x + 4, y + 14);

      doc.setFontSize(7);
      doc.setFont("helvetica", "normal");
      doc.setTextColor(150, 150, 150);
      doc.text(subtext, x + 4, y + 22);
  }
};
</script>
